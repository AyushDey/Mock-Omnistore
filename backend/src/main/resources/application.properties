spring.application.name=mockui
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/omnistore
spring.datasource.username=postgres
spring.datasource.password=ayushdey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Quotation API Integration
quotation.api.base-url=http://localhost:8081/api/quotation

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.omnistore.mockui=DEBUG
